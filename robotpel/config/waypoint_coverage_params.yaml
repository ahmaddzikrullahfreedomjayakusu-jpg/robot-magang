coverage_waypoint_node:
  ros__parameters:
    swath_width: 0.4              # jarak antar lajur (lebar kain pel), meter
    room_bounds: [0.0, 0.0, 5.0, 3.0]  # [x_min, y_min, x_max, y_max] meter -- GANTI sesuai batas ruangan di map kamu
    global_frame: map
    auto_start: true              # true = langsung kirim waypoint begitu node & Nav2 siap

cmd_vel_to_motor_bridge:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    motor_rpm_topic: /motor_rpm
    wheel_base: 0.50             # 25cm dari tengah ke tiap roda
    motor_neutral: 127           # nilai byte netral/stop (sama dengan robotmaganglidar1.py)
    motor_step: 30               # deviasi maksimum dari netral (rentang aman hasil uji: 97-157)
    max_linear_speed: 0.25       # m/s -- BELUM dikalibrasi di robot asli, lihat README
    cmd_vel_timeout: 0.5
    publish_rate: 20.0
    min_effective_step: 12       # perintah gerak kecil dibulatkan naik, biar ga kena zona mati motor
